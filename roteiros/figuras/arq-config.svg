<svg viewBox="0 0 560 300" role="img" aria-label="O config aponta as pastas, lê os arquivos de ambiente em ordem e imprime a checagem" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.5">
  <rect x="212" y="112" width="136" height="60" rx="6" stroke-width="2"/>
  <text x="280" y="139" text-anchor="middle" font-size="14" fill="currentColor" stroke="none">config.py</text>
  <text x="280" y="158" text-anchor="middle" font-size="11" fill="currentColor" stroke="none" opacity=".72">a fundação</text>

  <g class="passo" data-passo="0">
    <line x1="348" y1="128" x2="414" y2="94"/>
    <polygon points="414,94 405,96 409,103" fill="currentColor" stroke="none"/>
    <rect x="414" y="28" width="132" height="112" rx="5"/>
    <text x="480" y="50" text-anchor="middle" font-size="12.5" fill="currentColor" stroke="none">caminhos</text>
    <text x="480" y="74" text-anchor="middle" font-size="11" fill="currentColor" stroke="none" opacity=".78">DADOS</text>
    <text x="480" y="93" text-anchor="middle" font-size="11" fill="currentColor" stroke="none" opacity=".78">OUT_DIR</text>
    <text x="480" y="112" text-anchor="middle" font-size="11" fill="currentColor" stroke="none" opacity=".78">CACHE_DIR</text>
    <text x="480" y="131" text-anchor="middle" font-size="11" fill="currentColor" stroke="none" opacity=".78">SENTINELA</text>
  </g>

  <g class="passo" data-passo="1">
    <rect x="16" y="52" width="152" height="34" rx="4"/>
    <text x="92" y="74" text-anchor="middle" font-size="11.5" fill="currentColor" stroke="none">dados/.env</text>
    <rect x="16" y="96" width="152" height="34" rx="4" opacity=".6"/>
    <text x="92" y="118" text-anchor="middle" font-size="11.5" fill="currentColor" stroke="none">raiz/.env</text>
    <line x1="168" y1="70" x2="212" y2="128"/>
    <polygon points="212,128 204,124 202,132" fill="currentColor" stroke="none"/>
    <line x1="168" y1="113" x2="212" y2="136" opacity=".6"/>
    <text x="98" y="154" text-anchor="middle" font-size="11" fill="currentColor" stroke="none" opacity=".8">o primeiro vence</text>
    <text x="98" y="171" text-anchor="middle" font-size="11" fill="currentColor" stroke="none" opacity=".65">valor vazio não conta</text>
  </g>

  <g class="passo" data-passo="2">
    <line x1="280" y1="172" x2="280" y2="210"/>
    <polygon points="280,210 275.5,202 284.5,202" fill="currentColor" stroke="none"/>
    <rect x="148" y="210" width="264" height="72" rx="5"/>
    <text x="280" y="233" text-anchor="middle" font-size="12.5" fill="currentColor" stroke="none">python config.py</text>
    <text x="280" y="254" text-anchor="middle" font-size="11" fill="currentColor" stroke="none" opacity=".75">voz · modelo · idioma · velocidade</text>
    <text x="280" y="272" text-anchor="middle" font-size="11" fill="currentColor" stroke="none" opacity=".75">chave: definida, nunca impressa</text>
  </g>
</svg>

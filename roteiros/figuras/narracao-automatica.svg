<svg viewBox="0 0 560 300" role="img" aria-label="Enquanto o arquivo sentinela existir, cada resposta vira um roteiro falado antes de ser narrada" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.5"><g class="passo" data-passo="0"><rect x="24" y="108" width="134" height="64" rx="5"/><text x="91.0" y="145.0" text-anchor="middle" font-size="14" fill="currentColor" stroke="none">eu respondo</text><line x1="158" y1="140" x2="214" y2="140"/><polygon points="214,140 206,135.5 206,144.5" fill="currentColor" stroke="none"/><text x="186.0" y="131" text-anchor="middle" font-size="11" fill="currentColor" stroke="none" opacity=".8">fim do turno</text><rect x="214" y="108" width="134" height="64" rx="5"/><text x="281.0" y="136.0" text-anchor="middle" font-size="14" fill="currentColor" stroke="none">roteiro falado</text><text x="281.0" y="155.0" text-anchor="middle" font-size="11.5" fill="currentColor" stroke="none" opacity=".72">escrito na hora</text></g><g class="passo" data-passo="1"><rect x="214" y="28" width="134" height="48" rx="5" stroke-dasharray="5 4"/><text x="281.0" y="48.0" text-anchor="middle" font-size="14" fill="currentColor" stroke="none">narrar-respostas</text><text x="281.0" y="67.0" text-anchor="middle" font-size="11.5" fill="currentColor" stroke="none" opacity=".72">existe?</text><line x1="281" y1="76" x2="281" y2="104"/><polygon points="281,104 276.5,96 285.5,96" fill="currentColor" stroke="none"/></g><g class="passo" data-passo="2"><line x1="348" y1="140" x2="402" y2="140"/><polygon points="402,140 394,135.5 394,144.5" fill="currentColor" stroke="none"/><rect x="402" y="108" width="134" height="64" rx="5"/><text x="469.0" y="136.0" text-anchor="middle" font-size="14" fill="currentColor" stroke="none">narro o roteiro</text><text x="469.0" y="155.0" text-anchor="middle" font-size="11.5" fill="currentColor" stroke="none" opacity=".72">gasta créditos</text></g></svg>

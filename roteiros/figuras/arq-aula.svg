<svg viewBox="0 0 560 300" role="img" aria-label="Do roteiro em markdown à página única, passando pelos tempos de cada caractere" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.5">
  <g class="passo" data-passo="0">
    <rect x="16" y="42" width="158" height="128" rx="5"/>
    <text x="95" y="66" text-anchor="middle" font-size="12.5" fill="currentColor" stroke="none">roteiro .md</text>
    <text x="34" y="92" font-size="11" fill="currentColor" stroke="none" opacity=".8">## slide</text>
    <text x="34" y="112" font-size="11" fill="currentColor" stroke="none" opacity=".8">figura: ...svg</text>
    <text x="34" y="132" font-size="11" fill="currentColor" stroke="none" opacity=".8">- rótulo :: fala</text>
    <text x="34" y="152" font-size="11" fill="currentColor" stroke="none" opacity=".8">- rótulo :: fala</text>
  </g>

  <g class="passo" data-passo="1">
    <line x1="174" y1="106" x2="212" y2="106"/>
    <polygon points="212,106 204,101.5 204,110.5" fill="currentColor" stroke="none"/>
    <rect x="212" y="52" width="136" height="108" rx="5"/>
    <text x="280" y="76" text-anchor="middle" font-size="12.5" fill="currentColor" stroke="none">with-timestamps</text>
    <text x="280" y="98" text-anchor="middle" font-size="10.5" fill="currentColor" stroke="none" opacity=".72">áudio +</text>
    <text x="280" y="115" text-anchor="middle" font-size="10.5" fill="currentColor" stroke="none" opacity=".72">tempo de cada caractere</text>
    <line x1="230" y1="132" x2="330" y2="132" opacity=".5"/>
    <circle cx="248" cy="132" r="3" fill="currentColor"/>
    <circle cx="278" cy="132" r="3" fill="currentColor"/>
    <circle cx="312" cy="132" r="3" fill="currentColor"/>
    <text x="280" y="152" text-anchor="middle" font-size="10.5" fill="currentColor" stroke="none" opacity=".72">acende no instante certo</text>
  </g>

  <g class="passo" data-passo="2">
    <line x1="348" y1="106" x2="386" y2="106"/>
    <polygon points="386,106 378,101.5 378,110.5" fill="currentColor" stroke="none"/>
    <rect x="386" y="42" width="158" height="128" rx="5" stroke-width="2"/>
    <text x="465" y="66" text-anchor="middle" font-size="12.5" fill="currentColor" stroke="none">uma página .html</text>
    <rect x="402" y="80" width="126" height="42" rx="3" opacity=".7"/>
    <text x="465" y="106" text-anchor="middle" font-size="10.5" fill="currentColor" stroke="none" opacity=".8">slide + figura</text>
    <rect x="402" y="132" width="126" height="22" rx="3" opacity=".7"/>
    <text x="465" y="147" text-anchor="middle" font-size="10" fill="currentColor" stroke="none" opacity=".8">áudio embutido</text>
  </g>

  <rect x="140" y="212" width="280" height="66" rx="5" opacity=".55"/>
  <text x="280" y="236" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">aula.py + aula_template.html</text>
  <text x="280" y="258" text-anchor="middle" font-size="10.5" fill="currentColor" stroke="none" opacity=".72">269 linhas de montagem, 806 de página</text>
</svg>

<title>{{TITULO}}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #F4F2EF;
    --surface: #FFFFFF;
    --surface-2: #EBE7E1;
    --line: #D9D3CA;
    --ink: #1B1D24;
    --ink-2: #5C5F6B;
    --ink-3: #8A8D98;
    --sinal: #B4531F;
    --sinal-suave: #F0DCCE;
    --onda: #1F7A78;
    --sombra: 0 1px 2px rgba(27, 29, 36, .06), 0 12px 32px rgba(27, 29, 36, .07);
    --raio: 6px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #14161C;
      --surface: #1C1F27;
      --surface-2: #23272F;
      --line: #333843;
      --ink: #ECEAE6;
      --ink-2: #A8ACB6;
      --ink-3: #767C88;
      --sinal: #E58A55;
      --sinal-suave: #3A2418;
      --onda: #4FBDB2;
      --sombra: 0 1px 2px rgba(0, 0, 0, .4), 0 16px 40px rgba(0, 0, 0, .35);
    }
  }

  :root[data-theme="dark"] {
    --ground: #14161C;
    --surface: #1C1F27;
    --surface-2: #23272F;
    --line: #333843;
    --ink: #ECEAE6;
    --ink-2: #A8ACB6;
    --ink-3: #767C88;
    --sinal: #E58A55;
    --sinal-suave: #3A2418;
    --onda: #4FBDB2;
    --sombra: 0 1px 2px rgba(0, 0, 0, .4), 0 16px 40px rgba(0, 0, 0, .35);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "Public Sans", ui-sans-serif, system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .palco {
    max-width: 1120px;
    margin: 0 auto;
    padding: 40px 24px 168px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  header { display: flex; flex-direction: column; gap: 6px; }

  .eyebrow {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--sinal);
  }

  h1 {
    font-family: "Instrument Serif", Georgia, serif;
    font-weight: 400;
    font-size: clamp(2rem, 5vw, 3rem);
    line-height: 1.08;
    letter-spacing: -.01em;
    margin: 0;
    text-wrap: balance;
  }

  .subtitulo { color: var(--ink-2); max-width: 62ch; margin: 0; }

  .corpo {
    display: grid;
    grid-template-columns: 232px minmax(0, 1fr);
    gap: 28px;
    align-items: start;
  }

  @media (max-width: 800px) {
    .corpo { grid-template-columns: 1fr; }
    .trilha { order: 2; }
  }

  /* trilha de slides */
  .trilha { display: flex; flex-direction: column; gap: 2px; }

  .trilha-titulo {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-3);
    padding: 0 10px 10px;
  }

  .capitulo {
    display: grid;
    grid-template-columns: 44px minmax(0, 1fr);
    gap: 10px;
    align-items: baseline;
    text-align: left;
    background: none;
    border: 0;
    border-left: 2px solid transparent;
    padding: 9px 10px;
    color: var(--ink-2);
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    border-radius: 0 var(--raio) var(--raio) 0;
  }

  .capitulo:hover { background: var(--surface-2); color: var(--ink); }
  .capitulo:focus-visible { outline: 2px solid var(--onda); outline-offset: -2px; }

  .capitulo[aria-current="true"] {
    border-left-color: var(--sinal);
    background: var(--surface);
    color: var(--ink);
    font-weight: 500;
  }

  .capitulo .marca {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-3);
  }

  .capitulo[aria-current="true"] .marca { color: var(--sinal); }

  /* slide */
  .slide {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--raio);
    box-shadow: var(--sombra);
    padding: clamp(28px, 4vw, 48px);
    min-height: 400px;
    display: flex;
    flex-direction: column;
    gap: 26px;
  }

  .slide h2 {
    font-family: "Instrument Serif", Georgia, serif;
    font-weight: 400;
    font-size: clamp(1.7rem, 3.4vw, 2.4rem);
    line-height: 1.12;
    margin: 0;
    text-wrap: balance;
  }

  .slide.com-figura { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); grid-template-areas: "titulo titulo" "figura topicos"; column-gap: clamp(24px, 3.4vw, 44px); row-gap: 24px; align-items: start; }
  .slide.com-figura h2 { grid-area: titulo; }
  .slide.com-figura .figura { grid-area: figura; }
  .slide.com-figura .topicos { grid-area: topicos; align-self: center; }

  @media (max-width: 900px) {
    .slide.com-figura { grid-template-columns: 1fr; grid-template-areas: "titulo" "figura" "topicos"; }
  }

  .figura { margin: 0; display: none; }
  .slide.com-figura .figura { display: block; }
  .figura svg { width: 100%; height: auto; color: var(--ink-2); overflow: visible; }
  .figura img { width: 100%; height: auto; border-radius: var(--raio); display: block; }

  .figura .passo {
    color: var(--ink-3);
    opacity: .42;
    transition: opacity .4s ease, color .4s ease;
  }

  .figura .passo.dito { opacity: .78; color: var(--ink-2); }
  .figura .passo.ativo { opacity: 1; color: var(--sinal); }

  .figura text { font-family: "Public Sans", ui-sans-serif, system-ui, sans-serif; }

  @media (prefers-reduced-motion: reduce) { .figura .passo { transition: none; } }

  .topicos { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }

  .topico {
    display: grid;
    grid-template-columns: 14px minmax(0, 1fr);
    gap: 14px;
    align-items: start;
    font-size: clamp(1.02rem, 1.7vw, 1.22rem);
    line-height: 1.5;
    color: var(--ink-3);
    padding: 6px 10px 6px 0;
    border-radius: var(--raio);
    transition: color .35s ease, background-color .35s ease;
  }

  .topico::before {
    content: "";
    width: 8px;
    height: 8px;
    margin-top: .5em;
    border-radius: 50%;
    background: var(--line);
    transition: background-color .35s ease, transform .35s ease;
  }

  .topico.dito { color: var(--ink-2); }
  .topico.dito::before { background: var(--ink-3); }

  .topico.falando {
    color: var(--ink);
    background: var(--sinal-suave);
    padding-left: 10px;
    margin-left: -10px;
  }

  .topico.falando::before { background: var(--sinal); transform: scale(1.35); }

  @media (prefers-reduced-motion: reduce) {
    .topico, .topico::before { transition: none; }
  }

  /* player */
  .console {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--surface);
    border-top: 1px solid var(--line);
    box-shadow: 0 -8px 28px rgba(0, 0, 0, .08);
  }

  .console-inner {
    max-width: 1120px;
    margin: 0 auto;
    padding: 14px 24px 18px;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto auto;
    gap: 18px;
    align-items: center;
  }

  .tocar {
    width: 52px; height: 52px;
    border-radius: 50%;
    border: 0;
    background: var(--sinal);
    color: var(--surface);
    cursor: pointer;
    display: grid;
    place-items: center;
    flex: none;
  }

  .tocar:focus-visible { outline: 2px solid var(--onda); outline-offset: 3px; }
  .tocar svg { width: 20px; height: 20px; fill: currentColor; }

  .faixa { display: flex; flex-direction: column; gap: 7px; min-width: 0; }

  .barra {
    position: relative;
    height: 26px;
    cursor: pointer;
    display: flex;
    align-items: center;
  }

  .barra canvas { width: 100%; height: 26px; display: block; }

  .marcas { position: absolute; inset: 0; pointer-events: none; }

  .marca-slide {
    position: absolute;
    top: 0; bottom: 0;
    width: 1px;
    background: var(--line);
  }

  .legenda {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-3);
  }

  .legenda .agora { color: var(--ink-2); }

  .passos { display: flex; gap: 6px; }

  .passo {
    width: 38px; height: 38px;
    border-radius: var(--raio);
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-2);
    cursor: pointer;
    display: grid;
    place-items: center;
  }

  .passo:hover { background: var(--surface-2); color: var(--ink); }
  .passo:focus-visible { outline: 2px solid var(--onda); outline-offset: 2px; }
  .passo svg { width: 15px; height: 15px; fill: currentColor; }

  @media (max-width: 620px) {
    .console-inner { grid-template-columns: auto minmax(0, 1fr) auto; padding: 12px 16px 16px; }
    .passos { display: none; }
    .palco { padding: 28px 16px 150px; }
  }

  .ajustes { display: flex; gap: 10px; align-items: center; }

  .ajuste {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .ajuste span {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  .ajuste select {
    font: inherit;
    font-size: 13px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--raio);
    padding: 6px 8px;
    cursor: pointer;
  }

  .ajuste select:focus-visible { outline: 2px solid var(--onda); outline-offset: 1px; }

  .console.respirando .tocar { background: var(--onda); }

  .volume { display: flex; align-items: center; gap: 6px; }

  .mudo {
    width: 30px; height: 30px;
    display: grid; place-items: center;
    background: none; border: 0; padding: 0;
    color: var(--ink-2); cursor: pointer;
    border-radius: var(--raio);
  }

  .mudo:hover { color: var(--ink); background: var(--surface-2); }
  .mudo:focus-visible { outline: 2px solid var(--onda); outline-offset: 1px; }
  .mudo svg { width: 17px; height: 17px; fill: currentColor; }

  .volume input[type="range"] {
    width: 78px;
    accent-color: var(--sinal);
    cursor: pointer;
    background: transparent;
  }

  .volume input[type="range"]:focus-visible { outline: 2px solid var(--onda); outline-offset: 3px; }

  @media (max-width: 760px) {
    .ajuste.pausa { display: none; }
  }

  .atalhos {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: .04em;
  }
</style>

<div class="palco">
  <header>
    <span class="eyebrow" id="eyebrow">aula narrada</span>
    <h1 id="titulo"></h1>
    <p class="subtitulo" id="subtitulo"></p>
  </header>

  <div class="corpo">
    <nav class="trilha" id="trilha" aria-label="Slides da aula">
      <span class="trilha-titulo">Slides</span>
    </nav>

    <section class="slide" aria-live="polite">
      <h2 id="slide-titulo"></h2>
      <figure class="figura" id="figura"></figure>
      <ul class="topicos" id="topicos"></ul>
    </section>
  </div>

  <p class="atalhos">espaço toca e pausa · ← → pulam de slide · ↑ ↓ mudam o volume</p>
</div>

<div class="console">
  <div class="console-inner">
    <button class="tocar" id="tocar" aria-label="Tocar">
      <svg viewBox="0 0 24 24" id="icone-tocar"><path d="M8 5v14l11-7z"></path></svg>
    </button>

    <div class="faixa">
      <div class="barra" id="barra" role="slider" tabindex="0"
           aria-label="Posição na aula" aria-valuemin="0" aria-valuenow="0">
        <canvas id="onda"></canvas>
        <div class="marcas" id="marcas"></div>
      </div>
      <div class="legenda">
        <span class="agora"><span id="tempo">0:00</span> / <span id="total">0:00</span></span>
        <span id="posicao"></span>
      </div>
    </div>

    <div class="ajustes">
      <label class="ajuste">
        <span>velocidade</span>
        <select id="velocidade">
          <option value="0.75">0,75×</option>
          <option value="0.9">0,9×</option>
          <option value="1" selected>1×</option>
          <option value="1.15">1,15×</option>
          <option value="1.3">1,3×</option>
        </select>
      </label>
      <div class="ajuste">
        <span>volume</span>
        <div class="volume">
          <button class="mudo" id="mudo" aria-label="Silenciar">
            <svg viewBox="0 0 24 24" id="icone-som"><path d="M4 9v6h4l5 4V5L8 9H4z"></path></svg>
          </button>
          <input type="range" id="volume" min="0" max="1" step="0.05" value="1"
                 aria-label="Volume">
        </div>
      </div>
      <label class="ajuste pausa">
        <span>pausa</span>
        <select id="pausa">
          <option value="0">sem</option>
          <option value="0.6">0,6 s</option>
          <option value="1.2" selected>1,2 s</option>
          <option value="2">2 s</option>
          <option value="3">3 s</option>
        </select>
      </label>
    </div>

    <div class="passos">
      <button class="passo" id="anterior" aria-label="Slide anterior">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"></path></svg>
      </button>
      <button class="passo" id="proximo" aria-label="Próximo slide">
        <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zm-2.5 6L5 6v12z"></path></svg>
      </button>
    </div>
  </div>
</div>

<audio id="audio" preload="auto" src="{{AUDIO}}"></audio>

<script>
  const dados = {{DADOS}};
  const audio = document.getElementById("audio");
  const trilha = document.getElementById("trilha");
  const listaTopicos = document.getElementById("topicos");
  const slideTitulo = document.getElementById("slide-titulo");
  const figura = document.getElementById("figura");
  const secaoSlide = document.querySelector(".slide");
  const barra = document.getElementById("barra");
  const onda = document.getElementById("onda");
  const marcas = document.getElementById("marcas");
  const iconeTocar = document.getElementById("icone-tocar");
  const console_ = document.querySelector(".console");
  const seletorVelocidade = document.getElementById("velocidade");
  const seletorPausa = document.getElementById("pausa");
  const seletorVolume = document.getElementById("volume");
  const botaoMudo = document.getElementById("mudo");
  const iconeSom = document.getElementById("icone-som");
  const ALTO = "M4 9v6h4l5 4V5L8 9H4z";
  const MUDO = "M4 9v6h4l5 4V5L8 9H4zm11.5 3 3.5 3.5-1 1L14.5 13 11 16.5l-1-1L13.5 12 10 8.5l1-1 3.5 3.5L18 7.5l1 1L15.5 12z";
  let pausaEntre = 1.2;
  let volumeAnterior = 1;
  const TOCAR = "M8 5v14l11-7z";
  const PAUSAR = "M6 5h4v14H6zm8 0h4v14h-4z";

  let slideAtual = -1;
  let topicoAtual = -1;
  let respiro = null;       // timer da pausa entre tópicos
  let seekRecente = 0;      // pular de slide não deve disparar pausa

  // todos os tópicos em ordem, para achar fronteiras sem depender do slide
  const linha = [];
  dados.slides.forEach((slide, si) => slide.topicos.forEach((topico, ti) => {
    linha.push({ t: topico.t, si, ti });
  }));

  const guardado = {
    ler(chave, padrao) {
      try { return localStorage.getItem("aula:" + chave) ?? padrao; }
      catch (e) { return padrao; }
    },
    escrever(chave, valor) {
      try { localStorage.setItem("aula:" + chave, valor); } catch (e) { /* modo privado */ }
    },
  };

  document.getElementById("titulo").textContent = dados.titulo;
  document.getElementById("subtitulo").textContent = dados.subtitulo || "";
  document.getElementById("total").textContent = relogio(dados.duracao);

  function relogio(segundos) {
    const s = Math.max(0, Math.floor(segundos || 0));
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }

  // trilha lateral
  dados.slides.forEach((slide, i) => {
    const botao = document.createElement("button");
    botao.className = "capitulo";
    botao.type = "button";
    botao.innerHTML = '<span class="marca"></span><span class="rotulo"></span>';
    botao.querySelector(".marca").textContent = relogio(slide.t);
    botao.querySelector(".rotulo").textContent = slide.titulo;
    botao.addEventListener("click", () => irPara(slide.t + 0.02));
    trilha.appendChild(botao);
  });
  const capitulos = [...trilha.querySelectorAll(".capitulo")];

  // marcas de slide sobre a barra
  dados.slides.forEach(slide => {
    if (!slide.t) return;
    const marca = document.createElement("div");
    marca.className = "marca-slide";
    marca.style.left = (slide.t / dados.duracao * 100) + "%";
    marcas.appendChild(marca);
  });

  function mostrarSlide(indice) {
    if (indice === slideAtual) return;
    slideAtual = indice;
    const slide = dados.slides[indice];
    slideTitulo.textContent = slide.titulo;
    figura.innerHTML = slide.figura || "";
    secaoSlide.classList.toggle("com-figura", Boolean(slide.figura));
    listaTopicos.replaceChildren();
    slide.topicos.forEach(topico => {
      const item = document.createElement("li");
      item.className = "topico";
      item.dataset.t = topico.t;
      item.textContent = topico.texto;
      listaTopicos.appendChild(item);
    });
    capitulos.forEach((c, i) => c.setAttribute("aria-current", String(i === indice)));
    document.getElementById("posicao").textContent =
      "slide " + (indice + 1) + " de " + dados.slides.length;
  }

  function acompanhar() {
    const t = audio.currentTime;
    let indice = 0;
    for (let i = 0; i < dados.slides.length; i++) {
      if (t >= dados.slides[i].t - 0.05) indice = i;
    }
    mostrarSlide(indice);

    const itens = [...listaTopicos.children];
    let falando = -1;
    itens.forEach((item, i) => {
      if (t >= Number(item.dataset.t) - 0.05) falando = i;
    });
    itens.forEach((item, i) => {
      item.classList.toggle("falando", i === falando);
      item.classList.toggle("dito", i < falando);
    });

    figura.querySelectorAll("[data-passo]").forEach(parte => {
      const passo = Number(parte.dataset.passo);
      parte.classList.toggle("ativo", passo === falando);
      parte.classList.toggle("dito", passo < falando);
    });

    // pausa entre tópicos: silêncio de verdade, controlado aqui, sem regravar áudio
    let global = -1;
    for (let i = 0; i < linha.length; i++) {
      if (t >= linha[i].t - 0.05) global = i;
    }
    // qualquer avanço de tópico pede respiro, não só o incremento exato: no
    // início o navegador ainda decodifica o áudio e os eventos chegam espaçados,
    // pulando fronteiras — era o trecho que saía corrido
    if (global > topicoAtual && topicoAtual >= 0
        && pausaEntre > 0 && !audio.paused && !respiro
        && Date.now() - seekRecente > 400) {
      respirar();
    }
    topicoAtual = global;

    document.getElementById("tempo").textContent = relogio(t);
    barra.setAttribute("aria-valuenow", Math.floor(t));
    desenhar(t / dados.duracao);
  }

  // forma de onda: uma silhueta estavel, derivada dos tempos dos topicos
  const alturas = [];
  for (let i = 0; i < 220; i++) {
    const t = i / 220 * dados.duracao;
    let dist = 99;
    dados.slides.forEach(s => s.topicos.forEach(top => {
      dist = Math.min(dist, Math.abs(t - top.t));
    }));
    const pulso = Math.exp(-dist * 1.6);
    const textura = 0.55 + 0.45 * Math.abs(Math.sin(i * 1.7) * Math.cos(i * 0.6));
    alturas.push(0.22 + 0.78 * pulso * textura);
  }

  function desenhar(progresso) {
    const escala = window.devicePixelRatio || 1;
    const largura = onda.clientWidth;
    const altura = 26;
    if (onda.width !== largura * escala) {
      onda.width = largura * escala;
      onda.height = altura * escala;
    }
    const ctx = onda.getContext("2d");
    ctx.setTransform(escala, 0, 0, escala, 0, 0);
    ctx.clearRect(0, 0, largura, altura);

    const estilo = getComputedStyle(document.documentElement);
    const passado = estilo.getPropertyValue("--onda").trim();
    const futuro = estilo.getPropertyValue("--line").trim();
    const passo = largura / alturas.length;

    alturas.forEach((h, i) => {
      const x = i * passo;
      const alt = h * (altura - 4);
      ctx.fillStyle = (i / alturas.length) <= progresso ? passado : futuro;
      ctx.fillRect(x, (altura - alt) / 2, Math.max(passo - 1, 1), alt);
    });
  }

  function respirar() {
    audio.pause();
    console_.classList.add("respirando");
    respiro = setTimeout(() => {
      respiro = null;
      console_.classList.remove("respirando");
      audio.play().catch(() => { /* o navegador pode exigir novo gesto */ });
    }, pausaEntre * 1000);
  }

  function cancelarRespiro() {
    if (!respiro) return;
    clearTimeout(respiro);
    respiro = null;
    console_.classList.remove("respirando");
  }

  function irPara(segundos) {
    seekRecente = Date.now();
    cancelarRespiro();
    // o teto e a duracao que o player enxerga, nao a calculada na geracao:
    // pedir alem dela faz o navegador ignorar o seek e seguir falando o trecho anterior
    const teto = Number.isFinite(audio.duration) && audio.duration > 0
      ? audio.duration - 0.05
      : dados.duracao;
    const alvo = Math.max(0, Math.min(segundos, teto));

    if (audio.readyState === 0) {           // metadados ainda nao chegaram
      audio.addEventListener("loadedmetadata", () => irPara(segundos), { once: true });
      return;
    }
    audio.currentTime = alvo;
    acompanhar();
  }

  function pularSlide(direcao) {
    const alvo = Math.min(Math.max(slideAtual + direcao, 0), dados.slides.length - 1);
    irPara(dados.slides[alvo].t + 0.02);
  }

  document.getElementById("tocar").addEventListener("click", () => {
    cancelarRespiro();
    audio.paused ? audio.play() : audio.pause();
  });
  document.getElementById("anterior").addEventListener("click", () => pularSlide(-1));
  document.getElementById("proximo").addEventListener("click", () => pularSlide(1));

  audio.addEventListener("play", () => {
    iconeTocar.firstElementChild.setAttribute("d", PAUSAR);
    document.getElementById("tocar").setAttribute("aria-label", "Pausar");
  });
  audio.addEventListener("pause", () => {
    iconeTocar.firstElementChild.setAttribute("d", TOCAR);
    document.getElementById("tocar").setAttribute("aria-label", "Tocar");
  });
  audio.addEventListener("timeupdate", acompanhar);

  // timeupdate dispara ~4x por segundo e engasga durante o decode inicial;
  // o quadro a quadro mantém o destaque e as pausas no lugar desde o começo
  function seguirQuadro() {
    if (audio.paused) return;
    acompanhar();
    requestAnimationFrame(seguirQuadro);
  }
  audio.addEventListener("play", seguirQuadro);

  barra.addEventListener("click", evento => {
    const caixa = barra.getBoundingClientRect();
    irPara((evento.clientX - caixa.left) / caixa.width * dados.duracao);
  });
  barra.addEventListener("keydown", evento => {
    if (evento.key === "ArrowLeft") { irPara(audio.currentTime - 5); evento.preventDefault(); }
    if (evento.key === "ArrowRight") { irPara(audio.currentTime + 5); evento.preventDefault(); }
  });

  document.addEventListener("keydown", evento => {
    if (evento.target.closest("button, select, input, [role=slider]") && evento.key !== " ") return;
    if (evento.key === " ") {
      cancelarRespiro();
      audio.paused ? audio.play() : audio.pause();
      evento.preventDefault();
    }
    if (evento.key === "ArrowRight") { pularSlide(1); evento.preventDefault(); }
    if (evento.key === "ArrowLeft") { pularSlide(-1); evento.preventDefault(); }
    if (evento.key === "ArrowUp") { aplicarVolume(audio.volume + 0.1); evento.preventDefault(); }
    if (evento.key === "ArrowDown") { aplicarVolume(audio.volume - 0.1); evento.preventDefault(); }
  });

  seletorVelocidade.value = guardado.ler("velocidade", "1");
  seletorPausa.value = guardado.ler("pausa", "1.2");
  pausaEntre = Number(seletorPausa.value);
  aplicarVelocidade();

  function aplicarVelocidade() {
    const taxa = Number(seletorVelocidade.value);
    audio.defaultPlaybackRate = taxa;  // o elemento volta a esta ao carregar
    audio.playbackRate = taxa;
  }

  seletorVelocidade.addEventListener("change", () => {
    aplicarVelocidade();
    guardado.escrever("velocidade", seletorVelocidade.value);
  });

  audio.addEventListener("loadedmetadata", aplicarVelocidade);
  audio.addEventListener("play", aplicarVelocidade);

  seletorPausa.addEventListener("change", () => {
    pausaEntre = Number(seletorPausa.value);
    cancelarRespiro();
    guardado.escrever("pausa", seletorPausa.value);
  });

  function aplicarVolume(valor, guardar = true) {
    const nivel = Math.min(1, Math.max(0, valor));
    audio.volume = nivel;
    seletorVolume.value = String(nivel);
    iconeSom.firstElementChild.setAttribute("d", nivel === 0 ? MUDO : ALTO);
    botaoMudo.setAttribute("aria-label", nivel === 0 ? "Restaurar som" : "Silenciar");
    if (guardar) guardado.escrever("volume", String(nivel));
  }

  seletorVolume.addEventListener("input", () => {
    const nivel = Number(seletorVolume.value);
    if (nivel > 0) volumeAnterior = nivel;
    aplicarVolume(nivel);
  });

  botaoMudo.addEventListener("click", () => {
    if (audio.volume > 0) {
      volumeAnterior = audio.volume;
      aplicarVolume(0);
    } else {
      aplicarVolume(volumeAnterior || 0.8);
    }
  });

  aplicarVolume(Number(guardado.ler("volume", "1")), false);
  volumeAnterior = audio.volume || 1;

  window.addEventListener("resize", () => desenhar(audio.currentTime / dados.duracao));
  mostrarSlide(0);
  desenhar(0);
</script>
